<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>منصة التحدي الجماعي - البرق</title>
    <style>
        /* --- تنسيق سريع وحديث --- */
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #0b1a2e 0%, #1a2f4f 50%, #0d1b2a 100%);
            color: #ffffff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            height: 100%;
            max-width: 480px;
            max-height: 860px;
            background: rgba(10, 20, 40, 0.6);
            backdrop-filter: blur(12px) saturate(160%);
            -webkit-backdrop-filter: blur(12px) saturate(160%);
            border-radius: 32px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 3px;
        }

        .screen {
            display: none;
            flex: 1;
            flex-direction: column;
            padding: 16px 18px 18px;
            overflow-y: auto;
            width: 100%;
            height: 100%;
            scroll-behavior: smooth;
        }
        .screen.active {
            display: flex;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }
        h2 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #b0c7e7;
            text-align: center;
            margin-bottom: 10px;
        }
        p {
            text-align: center;
            color: #a0b8d9;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        input,
        select {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            font-size: 0.95rem;
            text-align: center;
            color: #fff;
            outline: none;
            transition: all 0.15s ease;
            margin-bottom: 10px;
        }
        input:focus,
        select:focus {
            border-color: #00d2ff;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.08);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(145deg, #00c6ff, #0072ff);
            color: #fff;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 6px 20px rgba(0, 114, 255, 0.2);
            margin-bottom: 10px;
            letter-spacing: 0.2px;
        }
        button:active {
            transform: scale(0.97);
        }
        button:disabled {
            background: #3a4a66;
            color: #7a8aa6;
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.5;
        }

        .photo-uploader {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 14px;
        }
        .avatar-preview {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid #00d2ff;
            object-fit: cover;
            background: rgba(0, 0, 0, 0.2);
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.15);
            transition: 0.2s;
            padding: 2px;
        }
        .file-label {
            background: rgba(255, 255, 255, 0.03);
            color: #c0d0f0;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: 0.15s;
            margin-top: 8px;
            font-size: 0.85rem;
        }
        .file-label:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .user-photo-mini {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00d2ff;
            margin-left: 6px;
            vertical-align: middle;
            flex-shrink: 0;
        }

        .grid-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 4px 0 8px;
        }
        .btn-game-type {
            background: linear-gradient(145deg, #00b894, #00a381);
            color: #fff;
            box-shadow: 0 6px 18px rgba(0, 184, 148, 0.2);
        }
        .btn-game-type:nth-child(2) {
            background: linear-gradient(145deg, #fdcb6e, #e17055);
            box-shadow: 0 6px 18px rgba(225, 112, 85, 0.2);
        }

        .join-box {
            background: rgba(0, 0, 0, 0.1);
            padding: 12px 14px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            margin: 4px 0 2px;
        }

        .lobby-info {
            background: rgba(0, 0, 0, 0.15);
            padding: 12px 14px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            text-align: center;
            line-height: 1.7;
            font-weight: 600;
            margin-bottom: 12px;
            color: #b0d0ff;
            font-size: 0.9rem;
        }
        .lobby-info span {
            color: #ffd966;
        }
        .players-panel {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            flex: 1;
            min-height: 80px;
        }
        .players-list-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
        }
        .player-chip {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 4px 12px 4px 8px;
            border-radius: 30px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            font-weight: 600;
            color: #d0e0ff;
        }

        .invite-notification {
            background: linear-gradient(145deg, #f12711, #f5af19);
            padding: 10px 14px;
            border-radius: 16px;
            margin-bottom: 12px;
            font-weight: 700;
            text-align: center;
            color: #fff;
            box-shadow: 0 6px 20px rgba(241, 39, 17, 0.2);
            display: none;
        }
        .invite-notification button {
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            padding: 6px 14px;
            font-size: 0.85rem;
            margin-top: 6px;
            width: auto;
            display: inline-block;
            border-radius: 30px;
            box-shadow: none;
        }

        /* --- شاشة اللعب --- */
        .timer-bar-container {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            margin-bottom: 14px;
            overflow: hidden;
        }
        .timer-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            border-radius: 10px;
            transition: width 0.2s linear;
            width: 100%;
        }

        .question-box {
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 14px;
            text-align: center;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.12);
            border-radius: 18px;
            padding: 14px 12px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            color: #f0f8ff;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            flex: 1;
        }
        .opt-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1.5px solid rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 12px 14px;
            text-align: right;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.1s ease;
            color: #e8f0ff;
            font-weight: 600;
        }
        .opt-card:active {
            transform: scale(0.98);
        }
        .opt-card.selected {
            border-color: #00d2ff;
            background: rgba(0, 210, 255, 0.06);
        }
        .opt-card.correct {
            border-color: #00ff87 !important;
            background: rgba(0, 255, 135, 0.06) !important;
            color: #8effc0;
        }
        .opt-card.wrong {
            border-color: #ff4b2b !important;
            background: rgba(255, 75, 43, 0.06) !important;
            color: #ff8a7a;
        }

        .voters-container {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px dashed rgba(255, 255, 255, 0.03);
        }
        .voter-mini-chip {
            font-size: 0.7rem;
            background: rgba(0, 0, 0, 0.15);
            padding: 2px 8px 2px 4px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            color: #b0c8e8;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }
        .voter-mini-chip img {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            margin-left: 4px;
            object-fit: cover;
        }

        .status-footer {
            text-align: center;
            font-weight: 600;
            color: #ffd966;
            margin: 10px 0 6px;
            min-height: 20px;
            font-size: 0.85rem;
        }

        /* --- منصة التتويج --- */
        .podium-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 6px;
            margin: 16px 0 12px;
            height: 180px;
            flex: 1;
        }
        .podium-step {
            background: rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.02);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 12px;
            position: relative;
        }
        .podium-step.first {
            height: 100%;
            width: 100px;
            border-color: #ffd700;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.15), rgba(255, 215, 0, 0.03));
        }
        .podium-step.second {
            height: 75%;
            width: 85px;
            border-color: #c0d0e0;
        }
        .podium-step.third {
            height: 55%;
            width: 85px;
            border-color: #e8a87c;
        }
        .crown {
            font-size: 1.8rem;
            position: absolute;
            top: -28px;
            filter: drop-shadow(0 4px 10px rgba(255, 215, 0, 0.2));
        }
        .podium-step .avatar-preview {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 4px;
        }
        .podium-step .p-name {
            font-weight: 700;
            font-size: 0.8rem;
            text-align: center;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 2px;
            color: #e0ecff;
        }
        .podium-step .p-score {
            font-size: 0.75rem;
            color: #b0c8e8;
            margin-top: 2px;
        }
        .first .p-score {
            color: #ffd700;
        }

        /* سريع للشاشات الصغيرة */
        @media (max-width: 420px) {
            .app-container {
                border-radius: 20px;
                max-height: 100vh;
            }
            .screen {
                padding: 12px 12px 14px;
            }
            h1 {
                font-size: 1.2rem;
            }
            .question-box {
                font-size: 1rem;
                min-height: 60px;
                padding: 10px;
            }
            .podium-step.first {
                width: 80px;
            }
            .podium-step.second,
            .podium-step.third {
                width: 70px;
            }
            .avatar-preview {
                width: 70px;
                height: 70px;
            }
            button {
                padding: 12px;
                font-size: 0.9rem;
            }
            input {
                padding: 10px 12px;
                font-size: 0.9rem;
            }
        }

        /* تأثيرات إضافية */
        .badge-host {
            background: rgba(255, 215, 0, 0.08);
            padding: 1px 8px;
            border-radius: 30px;
            font-size: 0.65rem;
            color: #ffd700;
            border: 1px solid rgba(255, 215, 0, 0.06);
            margin-right: 4px;
        }

        /* مؤشر تحميل سريع */
        .loading-dots::after {
            content: '...';
            animation: dots 1s steps(3, end) infinite;
        }
        @keyframes dots {
            0% {
                content: '';
            }
            33% {
                content: '.';
            }
            66% {
                content: '..';
            }
            100% {
                content: '...';
            }
        }

        /* تأثير وميض للتنبيهات */
        .blink-slow {
            animation: blink 1.5s ease-in-out infinite;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.4;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">

        <!-- 1. شاشة تسجيل الدخول -->
        <div id="scrLogin" class="screen active">
            <h1>⚡ التحدي الجماعي</h1>
            <p>ارفع صورتك واكتب اسمك للانطلاق بسرعة البرق</p>

            <div class="photo-uploader">
                <img src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 24 24' fill='%2364748b'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>" class="avatar-preview" id="profilePhotoPreview">
                <input type="file" id="inpPlayerPhoto" accept="image/*" style="display: none;" onchange="previewAndProcessPhoto(this)">
                <label for="inpPlayerPhoto" class="file-label">📸 اختر صورة</label>
            </div>

            <input type="text" id="inpPlayerName" placeholder="اسمك..." maxlength="20">
            <button onclick="commitProfile()">🚀 انطلق الآن</button>
        </div>

        <!-- 2. الشاشة الرئيسية -->
        <div id="scrHome" class="screen">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; background:rgba(0,0,0,0.08); padding:8px 14px; border-radius:16px; border:1px solid rgba(255,255,255,0.02);">
                <div id="homeProfileDisplay" style="font-weight:700; display:flex; align-items:center; font-size:0.9rem; color:#d0e0ff;"></div>
                <button style="width:auto; padding:6px 14px; margin:0; font-size:0.75rem; background:rgba(255,255,255,0.02); color:#b0c8e8; box-shadow:none; border:1px solid rgba(255,255,255,0.02); border-radius:30px;" onclick="backToProfileUpdate()">⚙️ تعديل</button>
            </div>

            <div id="notifInvite" class="invite-notification">
                <span id="txtInviteNotify">📩 دعوة جديدة!</span>
                <button onclick="acceptDirectInvite()">دخول الغرفة ⚡</button>
            </div>

            <p style="font-weight:700; color:#90b0d0; text-align:right; margin-bottom:4px;">اختر التحدي:</p>
            <div class="grid-menu">
                <button class="btn-game-type" onclick="initiateRoom('أسئلة ثقافية وإسلامية')">🧠 أسئلة إسلامية وثقافية</button>
                <button class="btn-game-type" onclick="initiateRoom('ألغاز ومنافسة ذكاء')">🔍 ألغاز وعجائب</button>
            </div>

            <div class="join-box">
                <p style="margin-top:0; font-weight:600; text-align:right; color:#90b0d0; font-size:0.85rem;">دخول غرفة صديق:</p>
                <input type="text" id="inpRoomCode" placeholder="كود الغرفة (4 أرقام)" maxlength="4" inputmode="numeric">
                <button style="background:linear-gradient(145deg, #8b5cf6, #7c3aed); box-shadow:0 6px 18px rgba(124, 58, 237, 0.2); color:#fff;" onclick="connectRoomByCode()">🔑 دخول</button>
            </div>
        </div>

        <!-- 3. شاشة الانتظار (Lobby) -->
        <div id="scrLobby" class="screen">
            <div class="lobby-info">
                🏢 <span id="lobGameType">--</span><br>
                🔑 الكود: <span id="lobCodeText" style="color:#ffb347; font-size:1.3rem; letter-spacing:2px;">--</span><br>
                ⏱️ العداد: <span id="lobTimerText" style="color:#7bed9f;">20</span> ث
            </div>

            <div id="hostTimerWrapper" style="display:none; background:rgba(0,0,0,0.08); padding:10px 12px; border-radius:16px; border:1px solid rgba(255,255,255,0.02); margin-bottom:12px;">
                <p style="text-align:right; margin-bottom:4px; font-weight:600; color:#90b0d0; font-size:0.85rem;">⚙️ ضبط العداد:</p>
                <select id="selectTimerConfig" style="margin-bottom:0;" onchange="updateRoomTimerConfig(this.value)">
                    <option value="10">10 ث (سريع)</option>
                    <option value="20" selected>20 ث (قياسي)</option>
                    <option value="30">30 ث (هادئ)</option>
                </select>
            </div>

            <div style="background:rgba(0,0,0,0.06); padding:10px 12px; border-radius:16px; margin-bottom:12px; border:1px solid rgba(255,255,255,0.02);">
                <p style="margin:0 0 4px 0; font-size:0.8rem; font-weight:600; text-align:right; color:#90b0d0;">✉️ دعوة صديق:</p>
                <div style="display:flex; gap:4px;">
                    <input type="text" id="inpTargetPlayer" placeholder="اسم الصديق..." style="margin:0; padding:8px 10px; font-size:0.85rem; flex:1;">
                    <button style="background:rgba(255,255,255,0.03); width:auto; margin:0; padding:0 14px; border-radius:30px; color:#c0d0f0; border:1px solid rgba(255,255,255,0.02); box-shadow:none;" onclick="dispatchInvite()">إرسال</button>
                </div>
            </div>

            <div class="players-panel">
                <h3 style="font-size:0.8rem; margin-bottom:8px; text-align:right; color:#90b0d0;">👥 اللاعبون:</h3>
                <div class="players-list-grid" id="lobPlayersList"></div>
            </div>

            <button id="btnHostStart" style="background:linear-gradient(145deg, #00ff87, #00d68f); color:#0a1a2a; box-shadow:0 6px 20px rgba(0, 255, 135, 0.15);" onclick="hostFireStart()">🚀 بدء التحدي</button>
            <p id="lblWaitHost" style="color:#ffd966; font-weight:600; text-align:center; display:none; font-size:0.85rem;">⏳ انتظار المنظم...</p>
        </div>

        <!-- 4. شاشة اللعب -->
        <div id="scrGameplay" class="screen">
            <div class="timer-bar-container"><div class="timer-bar" id="uiTimerBar"></div></div>
            <div class="question-box" id="uiQuestionText">جاري التحميل...</div>
            <div class="options-list" id="uiOptionsContainer"></div>
            <div class="status-footer" id="uiStatusFooter">⏳ جاري التحديث...</div>
            <button id="btnNextQuestion" style="background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.02); box-shadow:none; color:#7bed9f; display:none; border-radius:30px; font-size:0.9rem;" onclick="hostAdvanceQuestion()" disabled>السؤال التالي ➡️</button>
        </div>

        <!-- 5. منصة التتويج -->
        <div id="scrPodium" class="screen">
            <h1>🏆 الأبطال</h1>
            <p style="margin-bottom:4px;">نتائج الجولة</p>

            <div class="podium-container">
                <div class="podium-step second" id="step2">
                    <div style="font-size:1.4rem; margin-bottom:2px;">🥈</div>
                    <div id="p2PhotoContainer"></div>
                    <div id="p2Name" class="p-name">--</div>
                    <div id="p2Score" class="p-score">0</div>
                </div>
                <div class="podium-step first" id="step1">
                    <div class="crown">👑</div>
                    <div style="font-size:1.6rem; margin-bottom:2px;">🥇</div>
                    <div id="p1PhotoContainer"></div>
                    <div id="p1Name" class="p-name">--</div>
                    <div id="p1Score" class="p-score" style="color:#ffd700;">0</div>
                </div>
                <div class="podium-step third" id="step3">
                    <div style="font-size:1.2rem; margin-bottom:2px;">🥉</div>
                    <div id="p3PhotoContainer"></div>
                    <div id="p3Name" class="p-name">--</div>
                    <div id="p3Score" class="p-score">0</div>
                </div>
            </div>

            <button style="background:linear-gradient(145deg, #ff416c, #e61a3a); color:#fff; box-shadow:0 6px 20px rgba(255, 65, 108, 0.15); margin-top:auto; border-radius:30px;" onclick="terminateSessionAndExit()">🚪 خروج</button>
        </div>

    </div>

    <script>
        // --- تحسين الأداء: استخدام Cache و Request مدمجة ---
        const dbURL = "https://sdfq-63ee0-default-rtdb.firebaseio.com/";

        // --- بنوك الأسئلة الموسعة ---
        const questionBanks = {
            "أسئلة ثقافية وإسلامية": [
                { q: "ما هي السورة التي تسمى الفاضحة لسرائر المنافقين؟", os: ["سورة التوبة", "سورة الأنفال", "سورة المنافقون",
                        "سورة الحشر"
                    ], a: 0 },
                { q: "كم عدد السجدات الواردة في القرآن الكريم بالكامل؟", os: ["12 سجدة", "14 سجدة", "15 سجدة",
                        "17 سجدة"
                    ], a: 2 },
                { q: "من هو الصحابي الجليل الذي اهتز لوفاته عرش الرحمن؟", os: ["سعد بن معاذ", "معاذ بن جبل",
                        "مصعب بن عمير", "حمزة بن عبدالمطلب"
                    ], a: 0 },
                { q: "ما هي السورة التي تسمى قلب القرآن؟", os: ["سورة يس", "سورة الرحمن", "سورة الملك",
                        "سورة الواقعة"
                    ], a: 0 },
                { q: "كم عدد الرسل الذين ذُكروا في القرآن؟", os: ["25", "26", "27", "28"], a: 0 }
            ],
            "ألغاز ومنافسة ذكاء": [
                { q: "له عين واحدة ولكنه لا يرى بها شيئاً، فما هو؟", os: ["المجهر", "الإبرة", "الإعصار", "البحر"],
                    a: 1 },
                { q: "ما هو الشيء الذي ينبض بلا قلب ويسير بلا أقدام؟", os: ["الساعة", "الماء", "الرياح", "القطار"],
                    a: 0 },
                { q: "ما هو الشيء الذي كلما زاد نقص؟", os: ["العمر", "المال", "الوقت", "الملح"], a: 0 },
                { q: "ما هو الشيء الذي تأكله ولا يستطيع أن يأكلك؟", os: ["النار", "الماء", "الهواء", "التراب"],
                    a: 0 }
            ]
        };

        // --- متغيرات الحالة ---
        let selectedPhotoBase64 = "data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 24 24' fill='%2364748b'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>";
        let myName = "";
        let currentRoomId = "";
        let isHost = false;
        let selectedBank = [];
        let hasVotedThisTurn = false;
        let pendingInviteCode = "";
        let localTimerValue = 20;
        let maxTimerLimit = 20;
        let timerCountdownInterval = null;
        let serverSyncInterval = null;
        let isGameActive = false;
        let lastSyncTime = 0;
        let syncInProgress = false;

        // --- تحميل البيانات المحفوظة بسرعة ---
        window.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('game_player_name');
            const savedPhoto = localStorage.getItem('game_player_photo');
            if (savedName && savedPhoto) {
                document.getElementById("inpPlayerName").value = savedName;
                selectedPhotoBase64 = savedPhoto;
                document.getElementById("profilePhotoPreview").src = savedPhoto;
            }
        });

        // --- معالجة الصورة بضغط سريع ---
        function previewAndProcessPhoto(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement("canvas");
                        const ctx = canvas.getContext("2d");
                        canvas.width = 70;
                        canvas.height = 70;
                        ctx.drawImage(img, 0, 0, 70, 70);
                        selectedPhotoBase64 = canvas.toDataURL("image/jpeg", 0.5);
                        document.getElementById("profilePhotoPreview").src = selectedPhotoBase64;
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // --- التنقل بين الشاشات ---
        function navigate(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // --- تسجيل الدخول السريع ---
        async function commitProfile() {
            myName = document.getElementById("inpPlayerName").value.trim().replace(/[^a-zA-Z0-9أ-ي]/g, "");
            if (myName === "") return alert("الرجاء كتابة اسمك!");
            if (myName.length < 2) return alert("الاسم يجب أن يكون حرفين على الأقل.");

            localStorage.setItem('game_player_name', myName);
            localStorage.setItem('game_player_photo', selectedPhotoBase64);

            // تحديث السيرفر بشكل غير متزامن دون انتظار
            fetch(`${dbURL}online_users/${myName}.json`, {
                method: 'PUT',
                body: JSON.stringify({ photo: selectedPhotoBase64, active: true, lastSeen: Date.now() })
            }).catch(() => {});

            document.getElementById("homeProfileDisplay").innerHTML =
                `<img src="${selectedPhotoBase64}" class="user-photo-mini"> <span>${myName}</span>`;
            navigate("scrHome");

            if (!serverSyncInterval) {
                serverSyncInterval = setInterval(executeGlobalSync, 1000); // مزامنة كل ثانية لسرعة البرق
            }
            setTimeout(executeGlobalSync, 100);
        }

        // --- العودة لتعديل الملف ---
        function backToProfileUpdate() {
            navigate("scrLogin");
            if (serverSyncInterval) {
                clearInterval(serverSyncInterval);
                serverSyncInterval = null;
            }
            currentRoomId = "";
            isHost = false;
            isGameActive = false;
        }

        // --- المزامنة الفائقة السرعة (محسنة) ---
        async function executeGlobalSync() {
            if (syncInProgress) return;
            syncInProgress = true;

            try {
                // 1. فحص الدعوات (خفيف)
                if (currentRoomId === "" && myName) {
                    try {
                        const resInv = await fetch(`${dbURL}invites/${myName}.json`);
                        const invData = await resInv.json();
                        if (invData && invData.roomCode) {
                            pendingInviteCode = invData.roomCode;
                            document.getElementById("txtInviteNotify").innerText =
                                `📩 دعوة من [${invData.from || 'صديق'}] للغرفة: ${pendingInviteCode}`;
                            document.getElementById("notifInvite").style.display = "block";
                        } else {
                            document.getElementById("notifInvite").style.display = "none";
                        }
                    } catch (e) { /* تجاهل */ }
                }

                // 2. مزامنة الغرفة (بسرعة)
                if (currentRoomId !== "" && myName) {
                    const resRoom = await fetch(`${dbURL}rooms/${currentRoomId}.json`);
                    const room = await resRoom.json();

                    if (!room) {
                        currentRoomId = "";
                        isHost = false;
                        isGameActive = false;
                        if (!document.getElementById("scrHome").classList.contains("active")) {
                            alert("تم إغلاق الغرفة.");
                            navigate("scrHome");
                        }
                        syncInProgress = false;
                        return;
                    }

                    // تحديث العداد
                    if (room.timerLimit && !isHost) {
                        maxTimerLimit = room.timerLimit;
                        document.getElementById("lobTimerText").innerText = maxTimerLimit;
                    }

                    // تحديث قائمة اللاعبين في اللوبي (سريع)
                    if (room.players && document.getElementById("scrLobby").classList.contains("active")) {
                        const listContainer = document.getElementById("lobPlayersList");
                        let html = '';
                        const playerNames = Object.keys(room.players);
                        if (playerNames.length === 0) {
                            html = `<span style="color:#7a8aa6;font-size:0.8rem;">لا يوجد لاعبون...</span>`;
                        } else {
                            playerNames.forEach(p => {
                                const photo = room.players[p]?.photo || selectedPhotoBase64;
                                const isHostBadge = (room.host === p) ? `<span class="badge-host">👑</span>` :
                                '';
                                html +=
                                    `<span class="player-chip"><img src="${photo}" class="user-photo-mini"> ${p} ${isHostBadge}</span>`;
                            });
                        }
                        listContainer.innerHTML = html;

                        // التحكم في أزرار المنظم
                        if (room.host === myName && room.status === 'waiting') {
                            document.getElementById("btnHostStart").style.display = "block";
                            document.getElementById("lblWaitHost").style.display = "none";
                            document.getElementById("hostTimerWrapper").style.display = "block";
                            isHost = true;
                        } else {
                            document.getElementById("btnHostStart").style.display = "none";
                            document.getElementById("lblWaitHost").style.display = room.status === 'waiting' ? "block" :
                                "none";
                            document.getElementById("hostTimerWrapper").style.display = "none";
                            isHost = false;
                        }
                    }

                    // معالجة حالة اللعب
                    if (room.status === "playing") {
                        if (!isGameActive) {
                            isGameActive = true;
                            selectedBank = questionBanks[room.gameType] || [];
                            maxTimerLimit = room.timerLimit || 20;
                        }
                        manageGameplayScreen(room);
                    } else if (room.status === "finished") {
                        isGameActive = false;
                        renderPodiumUI(room.players);
                    } else if (room.status === "waiting") {
                        isGameActive = false;
                        if (document.getElementById("scrGameplay").classList.contains("active")) {
                            navigate("scrLobby");
                        }
                    }
                }
            } catch (e) {
                // تجاهل الأخطاء للحفاظ على السرعة
            }
            syncInProgress = false;
        }

        // --- قبول الدعوة ---
        async function acceptDirectInvite() {
            if (pendingInviteCode) {
                document.getElementById("inpRoomCode").value = pendingInviteCode;
                await connectRoomByCode();
                document.getElementById("notifInvite").style.display = "none";
                fetch(`${dbURL}invites/${myName}.json`, { method: 'DELETE' }).catch(() => {});
            }
        }

        // --- إنشاء غرفة (محسّن) ---
        async function initiateRoom(gameType) {
            if (!myName) return alert("الرجاء تسجيل الدخول!");

            let roomCode = Math.floor(1000 + Math.random() * 9000).toString();
            try {
                const check = await fetch(`${dbURL}rooms/${roomCode}.json`);
                const existing = await check.json();
                if (existing) {
                    roomCode = Math.floor(1000 + Math.random() * 9000).toString();
                }
            } catch (e) { /* تجاهل */ }

            currentRoomId = roomCode;
            isHost = true;
            isGameActive = false;

            const roomData = {
                gameType: gameType,
                host: myName,
                status: "waiting",
                timerLimit: 20,
                currentQ: 0,
                calculatedQ: -1,
                players: {
                    [myName]: { photo: selectedPhotoBase64, score: 0, lastVote: -1 }
                }
            };

            try {
                await fetch(`${dbURL}rooms/${roomCode}.json`, { method: 'PUT', body: JSON.stringify(roomData) });
            } catch (e) {
                alert("فشل إنشاء الغرفة.");
                return;
            }

            document.getElementById("lobGameType").innerText = gameType;
            document.getElementById("lobCodeText").innerText = roomCode;
            document.getElementById("lobTimerText").innerText = "20";
            document.getElementById("hostTimerWrapper").style.display = "block";
            document.getElementById("btnHostStart").style.display = "block";
            document.getElementById("lblWaitHost").style.display = "none";

            navigate("scrLobby");
            setTimeout(executeGlobalSync, 100);
        }

        // --- الانضمام لغرفة ---
        async function connectRoomByCode() {
            const code = document.getElementById("inpRoomCode").value.trim();
            if (!code || code.length !== 4 || isNaN(code)) return alert("كود صحيح من 4 أرقام.");
            if (!myName) return alert("سجل الدخول أولاً!");

            try {
                const res = await fetch(`${dbURL}rooms/${code}.json`);
                const room = await res.json();
                if (!room) return alert("الكود غير صحيح.");

                if (room.status === "playing" || room.status === "finished") {
                    return alert("الغرفة قيد اللعب.");
                }

                currentRoomId = code;
                isHost = false;
                isGameActive = false;

                await fetch(`${dbURL}rooms/${code}/players/${myName}.json`, {
                    method: 'PUT',
                    body: JSON.stringify({ photo: selectedPhotoBase64, score: 0, lastVote: -1 })
                });

                document.getElementById("lobGameType").innerText = room.gameType || "غير معروف";
                document.getElementById("lobCodeText").innerText = code;
                document.getElementById("lobTimerText").innerText = room.timerLimit || 20;
                document.getElementById("hostTimerWrapper").style.display = "none";
                document.getElementById("btnHostStart").style.display = "none";
                document.getElementById("lblWaitHost").style.display = "block";

                navigate("scrLobby");
                setTimeout(executeGlobalSync, 100);

                fetch(`${dbURL}invites/${myName}.json`, { method: 'DELETE' }).catch(() => {});
                document.getElementById("notifInvite").style.display = "none";

            } catch (e) {
                alert("خطأ في الاتصال.");
            }
        }

        // --- إرسال دعوة ---
        async function dispatchInvite() {
            const target = document.getElementById("inpTargetPlayer").value.trim();
            if (!target) return alert("اكتب اسم الصديق.");
            if (target === myName) return alert("لا يمكن دعوة نفسك!");
            if (!currentRoomId) return alert("أنت لست في غرفة.");

            try {
                const res = await fetch(`${dbURL}online_users/${target}.json`);
                const user = await res.json();
                if (!user) return alert("اللاعب غير متصل.");

                await fetch(`${dbURL}invites/${target}.json`, {
                    method: 'PUT',
                    body: JSON.stringify({ from: myName, roomCode: currentRoomId, timestamp: Date.now() })
                });

                alert(`✅ تم إرسال الدعوة إلى ${target}`);
                document.getElementById("inpTargetPlayer").value = "";
            } catch (e) {
                alert("فشل إرسال الدعوة.");
            }
        }

        // --- تحديث العداد ---
        async function updateRoomTimerConfig(value) {
            if (!isHost || !currentRoomId) return;
            maxTimerLimit = parseInt(value);
            document.getElementById("lobTimerText").innerText = maxTimerLimit;
            fetch(`${dbURL}rooms/${currentRoomId}/timerLimit.json`, { method: 'PUT', body: JSON.stringify(maxTimerLimit) })
                .catch(() => {});
        }

        // --- بدء التحدي ---
        async function hostFireStart() {
            if (!isHost || !currentRoomId) return;
            try {
                const res = await fetch(`${dbURL}rooms/${currentRoomId}/players.json`);
                const players = await res.json();
                if (!players || Object.keys(players).length < 2) {
                    return alert("يلزم وجود لاعبين على الأقل.");
                }

                for (let p in players) {
                    await fetch(`${dbURL}rooms/${currentRoomId}/players/${p}/score.json`, { method: 'PUT',
                        body: JSON.stringify(0) });
                    await fetch(`${dbURL}rooms/${currentRoomId}/players/${p}/lastVote.json`, { method: 'PUT',
                        body: JSON.stringify(-1) });
                }
                await fetch(`${dbURL}rooms/${currentRoomId}/currentQ.json`, { method: 'PUT', body: JSON.stringify(0) });
                await fetch(`${dbURL}rooms/${currentRoomId}/calculatedQ.json`, { method: 'PUT', body: JSON.stringify(-1) });
                await fetch(`${dbURL}rooms/${currentRoomId}/status.json`, { method: 'PUT', body: JSON.stringify("playing") });

                document.getElementById("btnHostStart").style.display = "none";
                document.getElementById("lblWaitHost").style.display = "none";
                document.getElementById("hostTimerWrapper").style.display = "none";

                isGameActive = true;
                selectedBank = questionBanks[document.getElementById("lobGameType").innerText] || [];
                maxTimerLimit = parseInt(document.getElementById("lobTimerText").innerText) || 20;

                navigate("scrGameplay");
                setTimeout(executeGlobalSync, 100);
            } catch (e) {
                alert("خطأ أثناء بدء التحدي.");
            }
        }

        // --- إدارة شاشة اللعب (محسنة للأداء) ---
        function manageGameplayScreen(room) {
            const qIndex = room.currentQ || 0;
            const bank = selectedBank.length ? selectedBank : questionBanks[room.gameType] || [];
            if (qIndex >= bank.length) {
                if (isHost) {
                    fetch(`${dbURL}rooms/${currentRoomId}/status.json`, { method: 'PUT', body: JSON.stringify("finished") });
                }
                return;
            }

            const currentData = bank[qIndex];
            if (!currentData) return;

            const isNewQuestion = document.getElementById("uiQuestionText").getAttribute("data-q-idx") != qIndex;

            if (isNewQuestion) {
                if (!document.getElementById("scrGameplay").classList.contains("active")) {
                    navigate("scrGameplay");
                }
                hasVotedThisTurn = false;
                document.getElementById("uiQuestionText").setAttribute("data-q-idx", qIndex);
                document.getElementById("uiQuestionText").innerText = currentData.q;
                document.getElementById("btnNextQuestion").style.display = isHost ? "block" : "none";
                document.getElementById("btnNextQuestion").disabled = true;
                localTimerValue = maxTimerLimit;
                startLocalTimerBar();
            }

            // حساب المصوتين بسرعة
            let totalPlayers = 0,
                votedCount = 0;
            const playersWhoVoted = {};
            for (let p in room.players) {
                totalPlayers++;
                if (room.players[p].lastVote !== undefined && room.players[p].lastVote !== -1) {
                    votedCount++;
                    playersWhoVoted[p] = { vote: room.players[p].lastVote, photo: room.players[p].photo };
                }
            }

            const timeIsUp = localTimerValue <= 0;
            const allVoted = votedCount >= totalPlayers && totalPlayers > 0;

            // بناء الخيارات بكفاءة
            const container = document.getElementById("uiOptionsContainer");
            let html = '';

            currentData.os.forEach((opt, idx) => {
                let cardClass = "opt-card";
                if (room.players[myName] && room.players[myName].lastVote === idx && !timeIsUp && !allVoted) {
                    cardClass += " selected";
                }
                if (timeIsUp || allVoted) {
                    if (idx === currentData.a) cardClass += " correct";
                    else if (room.players[myName] && room.players[myName].lastVote === idx) cardClass += " wrong";
                }

                let votersHtml = "";
                if (timeIsUp || allVoted) {
                    votersHtml = `<div class="voters-container">`;
                    for (let player in playersWhoVoted) {
                        if (playersWhoVoted[player].vote === idx) {
                            votersHtml +=
                                `<span class="voter-mini-chip"><img src="${playersWhoVoted[player].photo || selectedPhotoBase64}" alt="">${player}</span>`;
                        }
                    }
                    votersHtml += `</div>`;
                }

                const disabledAttr = (timeIsUp || allVoted) ? 'style="cursor:default;opacity:0.7;"' : '';
                html +=
                    `<div class="${cardClass}" onclick="recordVote(${idx}, ${qIndex})" ${disabledAttr}>${opt} ${votersHtml}</div>`;
            });

            container.innerHTML = html;

            // تحديث الحالة
            if (allVoted || timeIsUp) {
                clearInterval(timerCountdownInterval);
                document.getElementById("uiTimerBar").style.width = "0%";
                document.getElementById("uiStatusFooter").innerHTML = "<span style='color:#7bed9f;'>✅ انتهى التصويت!</span>";
                if (isHost) {
                    document.getElementById("btnNextQuestion").disabled = false;
                    if (room.calculatedQ !== qIndex) {
                        processPointsAllocation(room, qIndex, currentData.a);
                    }
                }
            } else {
                document.getElementById("uiStatusFooter").innerText =
                    `⏳ انتظار التصويت... (${votedCount}/${totalPlayers})`;
            }

            if (isHost) {
                document.getElementById("btnNextQuestion").style.display = "block";
                document.getElementById("btnNextQuestion").disabled = !(allVoted || timeIsUp);
            }
        }

        // --- تسجيل التصويت ---
        async function recordVote(idx, qIndex) {
            if (hasVotedThisTurn) return;
            const currentQ = document.getElementById("uiQuestionText").getAttribute("data-q-idx");
            if (parseInt(currentQ) !== qIndex) return;

            hasVotedThisTurn = true;
            fetch(`${dbURL}rooms/${currentRoomId}/players/${myName}/lastVote.json`, {
                method: 'PUT',
                body: JSON.stringify(idx)
            }).catch(() => {});
        }

        // --- احتساب النقاط ---
        async function processPointsAllocation(room, qIndex, correctAnsIdx) {
            if (!isHost) return;
            try {
                await fetch(`${dbURL}rooms/${currentRoomId}/calculatedQ.json`, {
                    method: 'PUT',
                    body: JSON.stringify(qIndex)
                });

                for (let p in room.players) {
                    const pVote = room.players[p].lastVote;
                    let currentScore = room.players[p].score || 0;
                    if (pVote === correctAnsIdx) {
                        currentScore += 20;
                    }
                    await fetch(`${dbURL}rooms/${currentRoomId}/players/${p}/score.json`, {
                        method: 'PUT',
                        body: JSON.stringify(currentScore)
                    });
                }
            } catch (e) { /* تجاهل */ }
        }

        // --- المؤقت ---
        function startLocalTimerBar() {
            clearInterval(timerCountdownInterval);
            document.getElementById("uiTimerBar").style.width = "100%";
            localTimerValue = maxTimerLimit;

            timerCountdownInterval = setInterval(() => {
                localTimerValue--;
                let percent = Math.max((localTimerValue / maxTimerLimit) * 100, 0);
                document.getElementById("uiTimerBar").style.width = `${percent}%`;

                if (localTimerValue <= 0) {
                    clearInterval(timerCountdownInterval);
                    executeGlobalSync();
                }
            }, 1000);
        }

        // --- تقدم السؤال ---
        async function hostAdvanceQuestion() {
            if (!isHost) return;
            try {
                const res = await fetch(`${dbURL}rooms/${currentRoomId}/currentQ.json`);
                let current = await res.json() || 0;
                const nextQ = current + 1;

                const resRoom = await fetch(`${dbURL}rooms/${currentRoomId}.json`);
                const room = await resRoom.json();
                if (room && room.players) {
                    for (let p in room.players) {
                        await fetch(`${dbURL}rooms/${currentRoomId}/players/${p}/lastVote.json`, {
                            method: 'PUT',
                            body: JSON.stringify(-1)
                        });
                    }
                }

                await fetch(`${dbURL}rooms/${currentRoomId}/currentQ.json`, {
                    method: 'PUT',
                    body: JSON.stringify(nextQ)
                });

                hasVotedThisTurn = false;
                document.getElementById("btnNextQuestion").disabled = true;
                document.getElementById("uiStatusFooter").innerText = "⏳ جاري التحميل...";

                setTimeout(executeGlobalSync, 100);
            } catch (e) { /* تجاهل */ }
        }

        // --- عرض منصة التتويج ---
        function renderPodiumUI(playersData) {
            clearInterval(timerCountdownInterval);
            navigate("scrPodium");

            const sorted = [];
            for (let p in playersData) {
                sorted.push({
                    name: p,
                    score: playersData[p].score || 0,
                    photo: playersData[p].photo || selectedPhotoBase64
                });
            }
            sorted.sort((a, b) => b.score - a.score);

            const top3 = [null, null, null];
            sorted.forEach((p, i) => {
                if (i < 3) top3[i] = p;
            });

            // عرض الأبطال
            const renderPlayer = (index, containerId, nameId, scoreId, size) => {
                const p = top3[index];
                const container = document.getElementById(containerId);
                const nameEl = document.getElementById(nameId);
                const scoreEl = document.getElementById(scoreId);
                if (p) {
                    container.innerHTML = `<img src="${p.photo}" class="avatar-preview" style="width:${size}px;height:${size}px;">`;
                    nameEl.innerText = p.name;
                    scoreEl.innerText = `${p.score} ن`;
                } else {
                    container.innerHTML =
                        `<div class="avatar-preview" style="width:${size}px;height:${size}px;background:rgba(255,255,255,0.02);border-radius:50%;"></div>`;
                    nameEl.innerText = "--";
                    scoreEl.innerText = "0";
                }
            };

            renderPlayer(0, "p1PhotoContainer", "p1Name", "p1Score", 56);
            renderPlayer(1, "p2PhotoContainer", "p2Name", "p2Score", 48);
            renderPlayer(2, "p3PhotoContainer", "p3Name", "p3Score", 42);
        }

        // --- إنهاء الجلسة ---
        async function terminateSessionAndExit() {
            clearInterval(timerCountdownInterval);
            isGameActive = false;

            if (isHost && currentRoomId) {
                fetch(`${dbURL}rooms/${currentRoomId}.json`, { method: 'DELETE' }).catch(() => {});
            } else if (currentRoomId && myName) {
                fetch(`${dbURL}rooms/${currentRoomId}/players/${myName}.json`, { method: 'DELETE' }).catch(() => {});
            }

            currentRoomId = "";
            isHost = false;
            hasVotedThisTurn = false;
            navigate("scrHome");
            setTimeout(executeGlobalSync, 100);
        }

        // --- تنظيف عند الخروج ---
        window.addEventListener('beforeunload', () => {
            if (myName) {
                fetch(`${dbURL}online_users/${myName}.json`, { method: 'DELETE' }).catch(() => {});
            }
            if (serverSyncInterval) clearInterval(serverSyncInterval);
            if (timerCountdownInterval) clearInterval(timerCountdownInterval);
        });

        console.log("⚡ منصة التحدي الجماعي - نسخة البرق");
    </script>
</body>
</html>
