<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 لعبة الرسم السريعة - Draw Battle</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        h1 {
            color: #2d3748;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .game-stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .stat-box {
            background: #f7fafc;
            padding: 8px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            text-align: center;
        }
        
        .stat-box .label {
            font-size: 12px;
            color: #718096;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .stat-box .value {
            font-size: 20px;
            color: #2d3748;
            font-weight: 700;
        }
        
        #lobby {
            background: #f7fafc;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
        }
        
        #lobby h2 {
            color: #2d3748;
            margin-bottom: 20px;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        input {
            padding: 14px 20px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            width: 100%;
            max-width: 220px;
            transition: all 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        
        .btn {
            padding: 14px 30px;
            font-size: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: #48bb78;
            color: white;
        }
        
        .btn-success:hover {
            background: #38a169;
            transform: translateY(-2px);
        }
        
        .btn-danger {
            background: #fc8181;
            color: white;
        }
        
        .btn-danger:hover {
            background: #f56565;
            transform: translateY(-2px);
        }
        
        .btn-warning {
            background: #ed8936;
            color: white;
        }
        
        .btn-warning:hover {
            background: #dd6b20;
            transform: translateY(-2px);
        }
        
        .hidden {
            display: none !important;
        }
        
        #gameArea {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            margin-top: 20px;
        }
        
        @media (max-width: 768px) {
            #gameArea {
                grid-template-columns: 1fr;
            }
        }
        
        .canvas-wrapper {
            background: white;
            border-radius: 16px;
            border: 3px solid #e2e8f0;
            position: relative;
            aspect-ratio: 4/3;
            touch-action: none;
            overflow: hidden;
        }
        
        #paintCanvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
            touch-action: none;
        }
        
        .word-display {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 12px 30px;
            border-radius: 12px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 3px;
            backdrop-filter: blur(10px);
            z-index: 10;
            text-align: center;
        }
        
        .word-display .hint {
            font-size: 14px;
            font-weight: 400;
            color: #a0aec0;
            display: block;
            margin-top: 5px;
        }
        
        .timer {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: #fc8181;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 28px;
            font-weight: 700;
            backdrop-filter: blur(10px);
            z-index: 10;
            min-width: 70px;
            text-align: center;
        }
        
        .timer.warning {
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            background: #f7fafc;
            padding: 15px;
            border-radius: 12px;
        }
        
        .color-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .color-btn:hover {
            transform: scale(1.15);
        }
        
        .color-btn.active {
            border-color: #2d3748;
            transform: scale(1.15);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.5);
        }
        
        .brush-size {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-right: 10px;
        }
        
        .brush-size input {
            width: 80px;
            padding: 5px;
        }
        
        #chatArea {
            background: #f7fafc;
            border-radius: 12px;
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        #chatBox {
            height: 200px;
            overflow-y: auto;
            text-align: right;
            padding: 10px;
            background: white;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #e2e8f0;
        }
        
        .chat-message {
            padding: 8px 12px;
            margin-bottom: 6px;
            background: #edf2f7;
            border-radius: 8px;
            animation: slideIn 0.3s ease;
        }
        
        .chat-message.correct {
            background: #c6f6d5;
            border-right: 4px solid #48bb78;
        }
        
        .chat-message .sender {
            font-weight: 700;
            color: #2d3748;
        }
        
        .chat-message .points {
            color: #48bb78;
            font-weight: 700;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .chat-input-group {
            display: flex;
            gap: 8px;
        }
        
        #guessInput {
            flex: 1;
            max-width: none;
        }
        
        #playersArea {
            background: #f7fafc;
            border-radius: 12px;
            padding: 15px;
        }
        
        #playersArea h3 {
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: white;
            border-radius: 8px;
            margin-bottom: 5px;
            border: 1px solid #e2e8f0;
        }
        
        .player-item .name {
            font-weight: 600;
            color: #2d3748;
        }
        
        .player-item .score {
            background: #667eea;
            color: white;
            padding: 2px 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
        }
        
        .player-item .status {
            font-size: 12px;
            color: #48bb78;
        }
        
        /* Overlay for game end */
        .game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            border-radius: 12px;
            backdrop-filter: blur(5px);
        }
        
        .game-overlay h2 {
            color: white;
            font-size: 36px;
            margin-bottom: 10px;
        }
        
        .game-overlay p {
            color: #a0aec0;
            font-size: 18px;
            margin-bottom: 20px;
        }
        
        .game-overlay .btn {
            font-size: 18px;
            padding: 15px 40px;
        }
        
        .round-info {
            background: #f7fafc;
            padding: 10px 20px;
            border-radius: 12px;
            text-align: center;
        }
        
        .round-info .round-number {
            font-size: 18px;
            font-weight: 700;
            color: #2d3748;
        }
        
        .round-info .round-word {
            font-size: 14px;
            color: #718096;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <h1>🎨 Draw Battle</h1>
        <div class="game-stats">
            <div class="stat-box">
                <div class="label">الجولة</div>
                <div class="value" id="roundNumber">0/5</div>
            </div>
            <div class="stat-box">
                <div class="label">الراسم</div>
                <div class="value" id="currentDrawer">-</div>
            </div>
        </div>
    </div>

    <!-- Lobby -->
    <div id="lobby">
        <h2>🏠 انضم إلى اللعبة</h2>
        <div class="input-group">
            <input type="text" id="username" placeholder="👤 اسمك">
            <input type="text" id="roomCode" placeholder="🔑 رمز الغرفة">
            <button class="btn btn-primary" id="joinBtn">🚀 دخول</button>
        </div>
        <div style="margin-top: 15px; color: #718096; font-size: 14px;">
            💡 ادخل رمز الغرفة أو أنشئ غرفة جديدة بأي رقم
        </div>
    </div>

    <!-- Game Area -->
    <div id="gameArea" class="hidden">
        <!-- Canvas -->
        <div class="canvas-wrapper">
            <canvas id="paintCanvas"></canvas>
            
            <!-- Word Display -->
            <div class="word-display" id="wordDisplay">
                <span id="currentWord">???</span>
                <span class="hint" id="wordHint">اضغط ابدأ لبدء الجولة</span>
            </div>
            
            <!-- Timer -->
            <div class="timer" id="timer">60</div>
            
            <!-- Game Overlay -->
            <div class="game-overlay hidden" id="gameOverlay">
                <h2 id="overlayTitle">⏰ انتهى الوقت!</h2>
                <p id="overlayMessage">الكلمة كانت: <strong id="revealWord">---</strong></p>
                <button class="btn btn-primary" id="nextRoundBtn">الجولة التالية ➜</button>
            </div>
        </div>
        
        <!-- Sidebar -->
        <div class="sidebar">
            <!-- Controls -->
            <div class="controls">
                <div class="color-btn active" style="background: #000000;" data-color="#000000"></div>
                <div class="color-btn" style="background: #ff0000;" data-color="#ff0000"></div>
                <div class="color-btn" style="background: #00ff00;" data-color="#00ff00"></div>
                <div class="color-btn" style="background: #0000ff;" data-color="#0000ff"></div>
                <div class="color-btn" style="background: #ffa500;" data-color="#ffa500"></div>
                <div class="color-btn" style="background: #800080;" data-color="#800080"></div>
                <div class="color-btn" style="background: #ff69b4;" data-color="#ff69b4"></div>
                <div class="brush-size">
                    <input type="range" id="brushSize" min="1" max="20" value="4">
                </div>
                <button class="btn btn-danger" id="clearBtn" style="padding: 8px 16px; font-size: 14px;">🗑️ مسح</button>
                <button class="btn btn-warning" id="undoBtn" style="padding: 8px 16px; font-size: 14px;">↩️ تراجع</button>
            </div>
            
            <!-- Players -->
            <div id="playersArea">
                <h3>👥 اللاعبين</h3>
                <div id="playersList"></div>
            </div>
            
            <!-- Chat -->
            <div id="chatArea">
                <div id="chatBox"></div>
                <div class="chat-input-group">
                    <input type="text" id="guessInput" placeholder="✏️ اكتب تخمينك...">
                    <button class="btn btn-success" id="sendGuessBtn" style="padding: 12px 20px;">إرسال</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="importmap">
{
    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"
    }
}
</script>

<script type="module">
import { initializeApp } from "firebase/app";
import { getDatabase, ref, push, onValue, set, onChildAdded, update, remove } from "firebase/database";

// Firebase Config
const firebaseConfig = {
    apiKey: "AIzaSyD-G_jk_UgqxGUuedsRZuqgfQgrkGWG2MM",
    authDomain: "sdfq-63ee0.firebaseapp.com",
    databaseURL: "https://sdfq-63ee0-default-rtdb.firebaseio.com",
    projectId: "sdfq-63ee0",
    storageBucket: "sdfq-63ee0.firebasestorage.app",
    messagingSenderId: "210107075463",
    appId: "1:210107075463:web:469133f4305ecd61d42122"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

// DOM Elements
const lobby = document.getElementById('lobby');
const gameArea = document.getElementById('gameArea');
const joinBtn = document.getElementById('joinBtn');
const usernameInput = document.getElementById('username');
const roomInput = document.getElementById('roomCode');
const canvas = document.getElementById('paintCanvas');
const ctx = canvas.getContext('2d');
const clearBtn = document.getElementById('clearBtn');
const undoBtn = document.getElementById('undoBtn');
const guessInput = document.getElementById('guessInput');
const sendGuessBtn = document.getElementById('sendGuessBtn');
const chatBox = document.getElementById('chatBox');
const playersList = document.getElementById('playersList');
const currentWord = document.getElementById('currentWord');
const wordHint = document.getElementById('wordHint');
const timerDisplay = document.getElementById('timer');
const roundNumber = document.getElementById('roundNumber');
const currentDrawer = document.getElementById('currentDrawer');
const gameOverlay = document.getElementById('gameOverlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayMessage = document.getElementById('overlayMessage');
const revealWord = document.getElementById('revealWord');
const nextRoundBtn = document.getElementById('nextRoundBtn');
const brushSize = document.getElementById('brushSize');

// Game State
let myName = "";
let roomCode = "";
let isDrawing = false;
let currentColor = "#000000";
let currentBrushSize = 4;
let gameData = {
    round: 0,
    maxRounds: 5,
    drawer: "",
    word: "",
    timeLeft: 60,
    isPlaying: false,
    players: {},
    scores: {},
    drawingHistory: []
};

let timerInterval = null;
let isDrawer = false;

// Resize Canvas
function resizeCanvas() {
    const container = canvas.parentElement;
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = currentBrushSize;
}

window.addEventListener('resize', resizeCanvas);

// Color selection
document.querySelectorAll('.color-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentColor = btn.dataset.color;
    });
});

// Brush size
brushSize.addEventListener('input', (e) => {
    currentBrushSize = e.target.value;
    ctx.lineWidth = currentBrushSize;
});

// Join Game
joinBtn.addEventListener('click', () => {
    myName = usernameInput.value.trim();
    roomCode = roomInput.value.trim();
    
    if(!myName || !roomCode) {
        alert("الرجاء كتابة اسمك ورمز الغرفة!");
        return;
    }
    
    lobby.classList.add('hidden');
    gameArea.classList.remove('hidden');
    setTimeout(resizeCanvas, 100);
    
    // Add player to room
    const playerRef = ref(database, `rooms/${roomCode}/players/${myName}`);
    set(playerRef, {
        name: myName,
        score: 0,
        joined: Date.now()
    });
    
    // Initialize game if not exists
    const gameRef = ref(database, `rooms/${roomCode}/game`);
    onValue(gameRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
            gameData = { ...gameData, ...data };
            updateUI();
        }
    });
    
    listenToRoom();
    listenToPlayers();
    listenToChat();
    listenToDrawing();
});

// Drawing Functions
function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    let clientX, clientY;
    
    if (e.touches) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
        e.preventDefault();
    } else {
        clientX = e.clientX;
        clientY = e.clientY;
    }
    
    return {
        x: (clientX - rect.left) / canvas.width,
        y: (clientY - rect.top) / canvas.height
    };
}

function startDrawing(e) {
    if (!gameData.isPlaying || !isDrawer) return;
    e.preventDefault();
    isDrawing = true;
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x * canvas.width, pos.y * canvas.height);
}

function stopDrawing(e) {
    if (!isDrawing) return;
    isDrawing = false;
    ctx.beginPath();
    push(ref(database, `rooms/${roomCode}/drawing`), { action: 'stop' });
}

function draw(e) {
    if(!isDrawing || !gameData.isPlaying || !isDrawer) return;
    e.preventDefault();
    const pos = getPos(e);
    
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = currentBrushSize;
    ctx.lineTo(pos.x * canvas.width, pos.y * canvas.height);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(pos.x * canvas.width, pos.y * canvas.height);
    
    // Save to history for undo
    gameData.drawingHistory.push({ x: pos.x, y: pos.y, color: currentColor, size: currentBrushSize });
    
    push(ref(database, `rooms/${roomCode}/drawing`), {
        x: pos.x,
        y: pos.y,
        color: currentColor,
        size: currentBrushSize,
        action: 'draw'
    });
}

// Canvas Events
canvas.addEventListener('mousedown', startDrawing);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', stopDrawing);
canvas.addEventListener('mouseleave', stopDrawing);
canvas.addEventListener('touchstart', startDrawing, { passive: false });
canvas.addEventListener('touchmove', draw, { passive: false });
canvas.addEventListener('touchend', stopDrawing, { passive: false });

// Clear Canvas
clearBtn.addEventListener('click', () => {
    if (confirm('هل أنت متأكد من مسح اللوحة؟')) {
        set(ref(database, `rooms/${roomCode}/drawing`), null);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        gameData.drawingHistory = [];
    }
});

// Undo
undoBtn.addEventListener('click', () => {
    if (gameData.drawingHistory.length === 0) return;
    // Remove last 10 points
    const removeCount = Math.min(10, gameData.drawingHistory.length);
    gameData.drawingHistory.splice(-removeCount);
    // Redraw everything
    redrawCanvas();
});

function redrawCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.beginPath();
    gameData.drawingHistory.forEach(point => {
        if (point.action === 'stop') {
            ctx.beginPath();
        } else {
            ctx.strokeStyle = point.color;
            ctx.lineWidth = point.size || 4;
            ctx.lineTo(point.x * canvas.width, point.y * canvas.height);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(point.x * canvas.width, point.y * canvas.height);
        }
    });
}

// Game Words
const wordCategories = {
    animals: ['قطة', 'كلب', 'أسد', 'فيل', 'زرافة', 'نمر', 'أرنب', 'سلحفاة', 'دolphin', 'نسر'],
    objects: ['سيارة', 'طائرة', 'قلم', 'كتاب', 'هاتف', 'حاسوب', 'ساعة', 'مصباح', 'كرسي', 'طاولة'],
    food: ['بيتزا', 'برغر', 'معكرونة', 'شوكولاتة', 'آيس كريم', 'فطيرة', 'كعكة', 'سوشي', 'تفاح', 'موز'],
    places: ['مدرسة', 'مستشفى', 'مطعم', 'حديقة', 'شاطئ', 'جبل', 'غابة', 'مدينة', 'قرية', 'جامعة'],
    actions: ['رقص', 'غناء', 'قراءة', 'كتابة', 'سباحة', 'جري', 'قفز', 'رسم', 'طبخ', 'نوم']
};

function getRandomWord() {
    const categories = Object.values(wordCategories);
    const category = categories[Math.floor(Math.random() * categories.length)];
    return category[Math.floor(Math.random() * category.length)];
}

// Start Game
function startGame() {
    const gameRef = ref(database, `rooms/${roomCode}/game`);
    const players = Object.keys(gameData.players);
    
    if (players.length < 2) {
        alert('يلزم وجود لاعبين على الأقل للبدء!');
        return;
    }
    
    // Reset scores
    players.forEach(player => {
        update(ref(database, `rooms/${roomCode}/players/${player}`), { score: 0 });
    });
    
    // Start first round
    startRound(players);
}

function startRound(players) {
    const drawerIndex = gameData.round % players.length;
    const drawer = players[drawerIndex];
    const word = getRandomWord();
    
    gameData.round++;
    gameData.drawer = drawer;
    gameData.word = word;
    gameData.isPlaying = true;
    gameData.timeLeft = 60;
    gameData.drawingHistory = [];
    
    // Clear canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    set(ref(database, `rooms/${roomCode}/drawing`), null);
    
    // Update game state
    update(ref(database, `rooms/${roomCode}/game`), {
        round: gameData.round,
        maxRounds: gameData.maxRounds,
        drawer: drawer,
        word: word,
        isPlaying: true,
        timeLeft: 60
    });
    
    // Hide overlay
    gameOverlay.classList.add('hidden');
    
    // Start timer
    startTimer();
    
    // Update UI
    isDrawer = (drawer === myName);
    updateUI();
    
    // Show word only to drawer
    if (isDrawer) {
        currentWord.textContent = word;
        wordHint.textContent = '🎯 ارسم الكلمة!';
    } else {
        currentWord.textContent = '???';
        wordHint.textContent = '🔍 حاول تخمين الكلمة!';
    }
    
    // Add system message
    addChatMessage('🎮', `بدأت الجولة! ${drawer} يرسم الآن...`, 'system');
}

function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    
    timerInterval = setInterval(() => {
        gameData.timeLeft--;
        timerDisplay.textContent = gameData.timeLeft;
        
        if (gameData.timeLeft <= 10) {
            timerDisplay.classList.add('warning');
        }
        
        // Update in database
        update(ref(database, `rooms/${roomCode}/game`), { timeLeft: gameData.timeLeft });
        
        if (gameData.timeLeft <= 0) {
            clearInterval(timerInterval);
            endRound();
        }
    }, 1000);
}

function endRound() {
    gameData.isPlaying = false;
    clearInterval(timerInterval);
    timerDisplay.classList.remove('warning');
    
    // Show overlay
    gameOverlay.classList.remove('hidden');
    overlayTitle.textContent = '⏰ انتهى الوقت!';
    overlayMessage.innerHTML = `الكلمة كانت: <strong style="color: #48bb78;">${gameData.word}</strong>`;
    revealWord.textContent = gameData.word;
    
    // Update game state
    update(ref(database, `rooms/${roomCode}/game`), { isPlaying: false });
    
    // Check if game finished
    if (gameData.round >= gameData.maxRounds) {
        nextRoundBtn.textContent = '🏆 النتائج النهائية';
        overlayTitle.textContent = '🏆 انتهت اللعبة!';
        showFinalResults();
    } else {
        nextRoundBtn.textContent = '➜ الجولة التالية';
    }
}

function showFinalResults() {
    const players = Object.values(gameData.players);
    players.sort((a, b) => b.score - a.score);
    
    let results = '🏆 النتائج النهائية:\n';
    players.forEach((p, i) => {
        results += `${i+1}. ${p.name}: ${p.score} نقطة\n`;
    });
    
    overlayMessage.textContent = results;
}

// Next Round
nextRoundBtn.addEventListener('click', () => {
    if (gameData.round >= gameData.maxRounds) {
        // Reset game
        gameData.round = 0;
        gameData.players = {};
        gameData.scores = {};
        update(ref(database, `rooms/${roomCode}/game`), {
            round: 0,
            isPlaying: false
        });
        lobby.classList.remove('hidden');
        gameArea.classList.add('hidden');
        return;
    }
    
    const players = Object.keys(gameData.players);
    startRound(players);
});

// Guess Word
function sendGuess() {
    const text = guessInput.value.trim();
    if(!text || !gameData.isPlaying || isDrawer) return;
    
    // Check if guess is correct
    if (text === gameData.word) {
        // Correct guess!
        const points = Math.max(10, Math.ceil(gameData.timeLeft / 2));
        const playerRef = ref(database, `rooms/${roomCode}/players/${myName}`);
        const currentScore = gameData.players[myName]?.score || 0;
        update(playerRef, { score: currentScore + points });
        
        // Add correct message
        addChatMessage(myName, `🎉 تخمين صحيح! +${points} نقطة`, 'correct');
        
        // End round early
        clearInterval(timerInterval);
        endRound();
    } else {
        // Add to chat
        push(ref(database, `rooms/${roomCode}/chat`), {
            sender: myName,
            message: text,
            type: 'guess'
        });
    }
    
    guessInput.value = "";
}

sendGuessBtn.addEventListener('click', sendGuess);
guessInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendGuess(); });

// Listen to Room
function listenToRoom() {
    const gameRef = ref(database, `rooms/${roomCode}/game`);
    onValue(gameRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
            gameData = { ...gameData, ...data };
            updateUI();
            
            if (data.isPlaying) {
                // Show word if drawer
                if (data.drawer === myName) {
                    currentWord.textContent = data.word;
                    wordHint.textContent = '🎯 ارسم الكلمة!';
                } else {
                    currentWord.textContent = '???';
                    wordHint.textContent = '🔍 حاول تخمين الكلمة!';
                }
                timerDisplay.textContent = data.timeLeft || 60;
            }
        }
    });
}

// Listen to Players
function listenToPlayers() {
    const playersRef = ref(database, `rooms/${roomCode}/players`);
    onValue(playersRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
            gameData.players = data;
            updatePlayersList();
            
            // Auto start if 2+ players and game not started
            const playerCount = Object.keys(data).length;
            if (playerCount >= 2 && !gameData.isPlaying && gameData.round === 0) {
                setTimeout(startGame, 1000);
            }
        }
    });
}

// Listen to Chat
function listenToChat() {
    const chatRef = ref(database, `rooms/${roomCode}/chat`);
    onChildAdded(chatRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
            addChatMessage(data.sender, data.message, data.type || 'normal');
        }
    });
}

// Listen to Drawing
function listenToDrawing() {
    const drawingRef = ref(database, `rooms/${roomCode}/drawing`);
    onValue(drawingRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        
        // Only redraw if not the drawer (to avoid double drawing)
        if (!isDrawer || !gameData.isPlaying) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            gameData.drawingHistory = [];
            
            Object.values(data).forEach(point => {
                if (point.action === 'stop') {
                    ctx.beginPath();
                } else if (point.action === 'draw') {
                    ctx.strokeStyle = point.color;
                    ctx.lineWidth = point.size || 4;
                    ctx.lineTo(point.x * canvas.width, point.y * canvas.height);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(point.x * canvas.width, point.y * canvas.height);
                    
                    // Save to history
                    gameData.drawingHistory.push(point);
                }
            });
        }
    });
}

// Update UI
function updateUI() {
    roundNumber.textContent = `${gameData.round}/${gameData.maxRounds}`;
    currentDrawer.textContent = gameData.drawer || '-';
    timerDisplay.textContent = gameData.timeLeft || 60;
}

function updatePlayersList() {
    playersList.innerHTML = '';
    const players = Object.values(gameData.players);
    players.sort((a, b) => (b.score || 0) - (a.score || 0));
    
    players.forEach(player => {
        const div = document.createElement('div');
        div.className = 'player-item';
        const isCurrentDrawer = player.name === gameData.drawer;
        div.innerHTML = `
            <div>
                <span class="name">${player.name}</span>
                ${isCurrentDrawer && gameData.isPlaying ? ' <span class="status">🎨 يرسم</span>' : ''}
            </div>
            <span class="score">${player.score || 0}</span>
        `;
        playersList.appendChild(div);
    });
}

function addChatMessage(sender, message, type = 'normal') {
    const msgElement = document.createElement('div');
    msgElement.className = `chat-message ${type === 'correct' ? 'correct' : ''}`;
    
    if (type === 'system') {
        msgElement.innerHTML = `<span style="color: #718096; font-style: italic;">${message}</span>`;
    } else {
        const isCorrect = type === 'correct';
        msgElement.innerHTML = `
            <span class="sender">${sender}:</span> 
            ${message}
            ${isCorrect ? ' 🎉' : ''}
        `;
    }
    
    chatBox.appendChild(msgElement);
    chatBox.scrollTop = chatBox.scrollHeight;
}

// Initialize
resizeCanvas();
console.log('🎨 Draw Battle Game Loaded!');
console.log('💡 ادخل اسمك ورمز الغرفة للبدء');
</script>
