<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي السرعة الجماعي المصلح</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: #333; margin: 0; padding: 15px;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .game-card {
            background: white; border-radius: 20px; padding: 25px;
            width: 100%; max-width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        h1 { font-size: 1.6rem; color: #11998e; margin-top: 0; }
        .screen { display: none; }
        .active { display: block; }
        input[type="text"] {
            width: 100%; padding: 12px; border: 2px solid #ddd;
            border-radius: 10px; margin-bottom: 15px; font-size: 1rem; text-align: center;
        }
        button {
            width: 100%; padding: 14px; background: #11998e; color: white;
            border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; transition: 0.2s; margin-bottom: 10px;
        }
        button:disabled { background: #95a5a6; cursor: not-allowed; }
        button:active { transform: scale(0.98); }
        .option-btn { background: #f1f2f6; color: #333; text-align: right; padding: 15px; font-size: 1rem; display: block; width: 100%; border: none; border-radius: 8px; margin-bottom: 8px; cursor: pointer;}
        .option-btn:hover { background: #e4e7eb; }
        .leaderboard { margin-top: 20px; background: #f8f9fa; padding: 10px; border-radius: 10px; text-align: right; }
        .score-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<div class="game-card">
    <h1>🎯 تحدي السرعة (أونلاين 12 لاعب)</h1>
    <p style="font-size:0.85rem; color:#777; margin-top:-10px;">متزامن بالكامل وحلال 🍃</p>

    <!-- شاشة تسجيل الدخول -->
    <div id="loginScreen" class="screen active">
        <p>أدخل اسمك للانضمام إلى الغرفة المشتركة مع أصحابك:</p>
        <input type="text" id="pNameInput" placeholder="اكتب اسمك الفعلي...">
        <button id="loginBtn" onclick="joinRoom()">دخول الغرفة المشتركة 🚀</button>
    </div>

    <!-- شاشة الانتظار واللعب -->
    <div id="gameScreen" class="screen">
        <h3 id="questionText">في انتظار بدء السؤال الأول...</h3>
        <div id="optionsContainer"></div>
        <div id="feedbackText" style="font-weight:bold; margin: 15px 0;"></div>
        
        <button id="nextQBtn" style="background:#2c3e50; display:none;" onclick="triggerNextQuestion()">السؤال التالي عند الجميع ➡️</button>

        <div class="leaderboard">
            <strong>📊 الصدارة الحالية (تتحديث تلقائي):</strong>
            <div id="leaderboardContent"></div>
        </div>
    </div>
</div>

<script>
    // الرابط المباشر الصحيح والمدعوم لبيانات مشروعك
    const dbURL = "https://sdfq-63ee0-default-rtdb.firebaseio.com/";

    const quizData = [
        { q: "ما هي السورة التي تعدل ثلث القرآن الكريم؟", os: ["سورة الإخلاص", "سورة الفاتحة", "سورة الكافرون", "سورة الملك"], a: 0 },
        { q: "من هو أول مؤذن في الإسلام؟", os: ["بلال بن رباح", "عمرو بن العاص", "أبو بكر الصديق", "أنس بن مالك"], a: 0 },
        { q: "كم عدد أركان الإسلام؟", os: ["3 أركان", "4 أركان", "5 أركان", "6 أركان"], a: 2 },
        { q: "ما هي أطول سورة في القرآن الكريم？", os: ["سورة آل عمران", "سورة البقرة", "سورة النساء", "سورة المائدة"], a: 1 }
    ];

    let myName = "";
    let hasAnswered = false;
    let isManager = false;

    async function joinRoom() {
        myName = document.getElementById("pNameInput").value.trim();
        if(myName === "") return alert("اكتب اسمك أولاً!");

        document.getElementById("loginBtn").disabled = true;

        try {
            // تسجيل اللاعب وحفظه مباشرة في السيرفر
            await fetch(`${dbURL}players/${myName}.json`, {
                method: 'PUT',
                body: JSON.stringify({ score: 0 })
            });

            document.getElementById("loginScreen").classList.remove("active");
            document.getElementById("gameScreen").classList.add("active");

            if(confirm("هل أنت منظم اللعبة الرئيسي؟ (اضغط موافق لإعادة تصفير اللعبة والتحكم بالأسئلة)")) {
                isManager = true;
                document.getElementById("nextQBtn").style.display = "block";
                await fetch(`${dbURL}gameState.json`, {
                    method: 'PUT',
                    body: JSON.stringify({ currentQ: 0 })
                });
            }

            // تشغيل التحديث التلقائي كل ثانية واحدة لمزامنة الأجهزة
            setInterval(syncGame, 1500);
            syncGame();

        } catch (error) {
            alert("حدث خطأ في الاتصال بالخادم، تأكد من إعدادات وضع الاختبار في فايربيس.");
            document.getElementById("loginBtn").disabled = false;
        }
    }

    async function syncGame() {
        try {
            // مزامنة حالة السؤال الحالي لجميع الجوالات
            const resState = await fetch(`${dbURL}gameState.json`);
            const state = await resState.json();
            
            if(state && state.currentQ !== undefined) {
                const qIndex = state.currentQ;
                
                // إذا تغير السؤال عند الموزع، نقوم بإعادة تفعيل الاختيارات
                if(document.getElementById("questionText").getAttribute("data-q-idx") != qIndex) {
                    hasAnswered = false;
                    document.getElementById("feedbackText").innerText = "";
                    document.getElementById("questionText").setAttribute("data-q-idx", qIndex);
                    
                    if(qIndex >= quizData.length) {
                        document.getElementById("questionText").innerText = "🎉 انتهت اللعبة! تفقد لوحة الصدارة لمعرفة الفائز.";
                        document.getElementById("optionsContainer").innerHTML = "";
                    } else {
                        const currentData = quizData[qIndex];
                        document.getElementById("questionText").innerText = currentData.q;
                        
                        const container = document.getElementById("optionsContainer");
                        container.innerHTML = "";
                        currentData.os.forEach((opt, idx) => {
                            container.innerHTML += `<button class="option-btn" onclick="submitAnswer(${idx}, ${qIndex})">${opt}</button>`;
                        });
                    }
                }
            }

            // مزامنة وتحديث لوحة الصدارة فورياً عند اللاعبين الـ 12
            const resPlayers = await fetch(`${dbURL}players.json`);
            const playersData = await resPlayers.json();
            
            if(playersData) {
                const leaderboard = document.getElementById("leaderboardContent");
                leaderboard.innerHTML = "";
                
                let sorted = [];
                for(let p in playersData) { if(playersData[p]) sorted.push({name: p, score: playersData[p].score || 0}); }
                sorted.sort((a,b) => b.score - a.score);

                sorted.forEach(p => {
                    leaderboard.innerHTML += `<div class="score-row"><span>👤 ${p.name}</span><span><b>${p.score}</b> نقطة</span></div>`;
                });
            }
        } catch(e) { console.log("خطأ في المزامنة المباشرة"); }
    }

    async function submitAnswer(selectedIdx, qIndex) {
        if(hasAnswered) return;
        hasAnswered = true;

        const correctAnswer = quizData[qIndex].a;
        const buttons = document.getElementsByClassName("option-btn");
        for(let b of buttons) b.disabled = true;

        if(selectedIdx === correctAnswer) {
            document.getElementById("feedbackText").innerHTML = "<span style='color:#2ed573'>✅ ممتاز! إجابة صحيحة جاري إضافة النقاط...</span>";
            try {
                // جلب النقاط الحالية وزيادتها بـ 10 نقاط
                const res = await fetch(`${dbURL}players/${myName}/score.json`);
                const currentScore = await res.json() || 0;
                
                await fetch(`${dbURL}players/${myName}/score.json`, {
                    method: 'PUT',
                    body: JSON.stringify(currentScore + 10)
                });
                document.getElementById("feedbackText").innerHTML = "<span style='color:#2ed573'>✅ ممتاز! تم احتساب النقاط (+10)</span>";
            } catch(e) { }
        } else {
            document.getElementById("feedbackText").innerHTML = `<span style='color:#ff4757'>❌ خاطئة! الإجابة الصحيحة هي: ${quizData[qIndex].os[correctAnswer]}</span>`;
        }
    }

    async function triggerNextQuestion() {
        if(!isManager) return;
        try {
            const res = await fetch(`${dbURL}gameState/currentQ.json`);
            const current = await res.json() || 0;
            
            await fetch(`${dbURL}gameState/currentQ.json`, {
                method: 'PUT',
                body: JSON.stringify(current + 1)
            });
        } catch(e) {}
    }
</script>

</body>
</html>
