<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الرسم الجماعية السريعة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f0f2f5; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 10px; }
        .container { width: 100%; max-width: 900px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #333; margin-bottom: 20px; font-size: 24px; }
        input, button { padding: 12px; margin: 5px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; width: 100%; max-width: 200px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .hidden { display: none !important; }
        
        #gameArea { display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%; }
        #canvasContainer { width: 100%; max-width: 600px; aspect-ratio: 4/3; background: #fff; border: 3px solid #333; border-radius: 8px; touch-action: none; position: relative; }
        canvas { width: 100%; height: 100%; display: block; background: white; cursor: crosshair; touch-action: none; }
        
        .controls { display: flex; gap: 10px; justify-content: center; width: 100%; max-width: 600px; flex-wrap: wrap; }
        .color-btn { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 5px rgba(0,0,0,0.3); cursor: pointer; }
        #clearBtn { background: #dc3545; color: white; max-width: 100px; padding: 8px; }
        
        #chatArea { width: 100%; max-width: 600px; background: #fafafa; border: 1px solid #ddd; border-radius: 8px; padding: 10px; }
        #chatBox { height: 120px; overflow-y: auto; text-align: right; padding: 5px; border-bottom: 1px solid #eee; margin-bottom: 10px; font-size: 14px; }
        .chat-input-group { display: flex; gap: 5px; }
        #guessInput { flex: 1; max-width: none; }
        #sendGuessBtn { max-width: 80px; }
        
        @media (min-width: 768px) {
            #gameArea { flex-direction: row; align-items: flex-start; justify-content: center; }
            #canvasContainer { flex: 2; }
            #sidebar { flex: 1; display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 280px; }
            #chatArea { max-width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎨 لعبة الرسم الجماعية السريعة</h1>

    <div id="lobby">
        <input type="text" id="username" placeholder="اكتب اسمك هنا">
        <input type="text" id="roomCode" placeholder="رمز الغرفة (مثال: 123)">
        <button id="joinBtn">دخول اللعبة</button>
    </div>

    <div id="gameArea" class="hidden">
        <div id="canvasContainer">
            <canvas id="paintCanvas"></canvas>
        </div>
        
        <div id="sidebar">
            <div class="controls">
                <div class="color-btn" style="background: #000000;" onclick="changeColor('#000000')"></div>
                <div class="color-btn" style="background: #ff0000;" onclick="changeColor('#ff0000')"></div>
                <div class="color-btn" style="background: #00ff00;" onclick="changeColor('#00ff00')"></div>
                <div class="color-btn" style="background: #0000ff;" onclick="changeColor('#0000ff')"></div>
                <button id="clearBtn">مسح</button>
            </div>
            
            <div id="chatArea">
                <div id="chatBox"></div>
                <div class="chat-input-group">
                    <input type="text" id="guessInput" placeholder="اكتب تخمينك هنا...">
                    <button id="sendGuessBtn">إرسال</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="importmap">
{
    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"
    }
}
</script>

<script type="module">
// استيراد Firebase بشكل صحيح
import { initializeApp } from "firebase/app";
import { getDatabase, ref, push, onValue, set, onChildAdded } from "firebase/database";

// إعدادات Firebase الصحيحة
const firebaseConfig = {
    apiKey: "AIzaSyD-G_jk_UgqxGUuedsRZuqgfQgrkGWG2MM",
    authDomain: "sdfq-63ee0.firebaseapp.com",
    databaseURL: "https://sdfq-63ee0-default-rtdb.firebaseio.com",
    projectId: "sdfq-63ee0",
    storageBucket: "sdfq-63ee0.firebasestorage.app",
    messagingSenderId: "210107075463",
    appId: "1:210107075463:web:469133f4305ecd61d42122"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

const lobby = document.getElementById('lobby');
const gameArea = document.getElementById('gameArea');
const joinBtn = document.getElementById('joinBtn');
const usernameInput = document.getElementById('username');
const roomInput = document.getElementById('roomCode');
const canvas = document.getElementById('paintCanvas');
const ctx = canvas.getContext('2d');
const clearBtn = document.getElementById('clearBtn');
const guessInput = document.getElementById('guessInput');
const sendGuessBtn = document.getElementById('sendGuessBtn');
const chatBox = document.getElementById('chatBox');

let myName = "";
let roomCode = "";
let isDrawing = false;
let currentColor = "#000000";
let lastX = 0;
let lastY = 0;

// دالة ضبط حجم اللوحة
function resizeCanvas() {
    const container = canvas.parentElement;
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 4;
}

// استدعاء resize عند تحميل الصفحة وعند تغيير الحجم
window.addEventListener('resize', resizeCanvas);

joinBtn.addEventListener('click', () => {
    myName = usernameInput.value.trim();
    roomCode = roomInput.value.trim();
    
    if(!myName || !roomCode) {
        alert("الرجاء كتابة اسمك واختيار رمز للغرفة أولاً!");
        return;
    }
    
    lobby.classList.add('hidden');
    gameArea.classList.remove('hidden');
    
    // تأخير ضبط حجم اللوحة حتى تظهر
    setTimeout(resizeCanvas, 100);
    
    listenToRoom();
});

// دالة الحصول على موقع المؤشر بدقة
function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    let clientX, clientY;
    
    if (e.touches) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
        e.preventDefault();
    } else {
        clientX = e.clientX;
        clientY = e.clientY;
    }
    
    return {
        x: (clientX - rect.left) / canvas.width,
        y: (clientY - rect.top) / canvas.height
    };
}

function startDrawing(e) {
    e.preventDefault();
    isDrawing = true;
    const pos = getPos(e);
    lastX = pos.x;
    lastY = pos.y;
    ctx.beginPath();
    ctx.moveTo(pos.x * canvas.width, pos.y * canvas.height);
}

function stopDrawing(e) {
    if (!isDrawing) return;
    isDrawing = false;
    ctx.beginPath();
    push(ref(database, `rooms/${roomCode}/drawing`), { action: 'stop' });
}

function draw(e) {
    if(!isDrawing) return;
    e.preventDefault();
    const pos = getPos(e);
    
    // الرسم المحلي للتجاوب السريع
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = 4;
    ctx.lineTo(pos.x * canvas.width, pos.y * canvas.height);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(pos.x * canvas.width, pos.y * canvas.height);
    
    // إرسال البيانات للخادم
    push(ref(database, `rooms/${roomCode}/drawing`), {
        x: pos.x, 
        y: pos.y, 
        color: currentColor, 
        action: 'draw'
    });
}

// أحداث الماوس
canvas.addEventListener('mousedown', startDrawing);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', stopDrawing);
canvas.addEventListener('mouseleave', stopDrawing);

// أحداث اللمس
canvas.addEventListener('touchstart', startDrawing, { passive: false });
canvas.addEventListener('touchmove', draw, { passive: false });
canvas.addEventListener('touchend', stopDrawing, { passive: false });

window.changeColor = function(color) { 
    currentColor = color; 
}

clearBtn.addEventListener('click', () => { 
    if(confirm('هل أنت متأكد من مسح اللوحة؟')) {
        set(ref(database, `rooms/${roomCode}/drawing`), null);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
});

sendGuessBtn.addEventListener('click', sendGuess);
guessInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendGuess(); });

function sendGuess() {
    const text = guessInput.value.trim();
    if(!text) return;
    push(ref(database, `rooms/${roomCode}/chat`), { 
        sender: myName, 
        message: text,
        timestamp: Date.now()
    });
    guessInput.value = "";
}

function listenToRoom() {
    // الاستماع لتحديثات الرسم
    onValue(ref(database, `rooms/${roomCode}/drawing`), (snapshot) => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        const data = snapshot.val();
        if(!data) return;
        
        let isFirst = true;
        Object.values(data).forEach(point => {
            if(point.action === 'stop') { 
                ctx.beginPath();
                isFirst = true;
            }
            else if(point.action === 'draw') {
                ctx.strokeStyle = point.color;
                ctx.lineWidth = 4;
                const actualX = point.x * canvas.width;
                const actualY = point.y * canvas.height;
                
                if (isFirst) {
                    ctx.moveTo(actualX, actualY);
                    isFirst = false;
                } else {
                    ctx.lineTo(actualX, actualY);
                }
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(actualX, actualY);
            }
        });
    });
    
    // الاستماع للرسائل الجديدة
    onChildAdded(ref(database, `rooms/${roomCode}/chat`), (snapshot) => {
        const data = snapshot.val();
        const msgElement = document.createElement('div');
        msgElement.style.marginBottom = "5px";
        msgElement.style.padding = "5px";
        msgElement.style.backgroundColor = "#f8f9fa";
        msgElement.style.borderRadius = "4px";
        msgElement.innerHTML = `<strong>${data.sender}:</strong> ${data.message}`;
        chatBox.appendChild(msgElement);
        chatBox.scrollTop = chatBox.scrollHeight;
    });
}
</script>
</body>
</html>
